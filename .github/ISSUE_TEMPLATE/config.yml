# Template chooser: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository#configuring-the-template-chooser
# 空の Issue は、書き込みの権限がある人にだけ「Maintainers only」として表示される。gh issue create --title --body はこの設定に関係なく作れる。
blank_issues_enabled: false
contact_links:
  - name: 脆弱性の報告
    url: https://github.com/yokozi-jp/agent-software-factory/security/advisories/new
    about: 脆弱性は公開の Issue に書かず、private vulnerability reporting で非公開で報告してください。

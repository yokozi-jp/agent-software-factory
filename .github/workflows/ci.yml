name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # nrwl/nx-set-shas reads past workflow runs to find the last successful commit on main.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are for local development only.
  LEFTHOOK: "0"
  NX_NO_CLOUD: "true"

jobs:
  main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx affected compares against the merge base.
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - run: pnpm exec nx affected -t check test build

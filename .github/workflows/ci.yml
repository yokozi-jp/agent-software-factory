name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # nrwl/nx-set-shas reads past workflow runs to find the last successful commit on main.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are for local development only.
  LEFTHOOK: "0"
  NX_NO_CLOUD: "true"
  # Tools come only from mise.lock (docs/adr/0009).
  MISE_LOCKED: "1"

jobs:
  # The jobs run in parallel. `main` at the end is the required status check (.github/rulesets/protect-main.json),
  # so a job added here must also be listed in the `needs` of `main`, or it will not block a merge.

  # Checks that do not need the tools from mise.lock.
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # adr-check compares against the base of the pull request.
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Repo policy (docs/adr)
        run: node tools/scripts/src/checks/repo-policy/cli.ts

      # Runs the Renovate pinned in tools/scripts/sh/renovate.sh through pnpm dlx, so it needs the network.
      - name: Validate Renovate config
        run: tools/scripts/sh/renovate.sh validate

      - name: Agent skills match skills-lock.json
        run: node tools/scripts/src/checks/skills-lock/cli.ts

      # Warns, never fails: a change to a file that tends to carry a decision should add an ADR (docs/adr/0016).
      # In a pull request, GITHUB_BASE_REF names the base that the diff is taken from.
      - name: ADR check (warning only)
        run: node tools/scripts/src/checks/adr-check/cli.ts

      # Warns, never fails: a deleted test file or fewer test cases makes this a pull request a person reads
      # before merging it (#138, docs/code-review/agent-pull-requests.md). The same base as adr-check.
      - name: Test weakening check (warning only)
        run: node tools/scripts/src/checks/test-weakening/cli.ts

      - name: Lint Markdown
        run: pnpm lint:md

      - name: Docs bundle (OKF, links, orphans)
        run: node tools/scripts/src/checks/docs-check/cli.ts

      # Files outside apps/, packages/ and tools/ (root configs, docs/, .github/). Nx checks the projects.
      - name: Check root files
        run: pnpm check:root

      # Duplicate code in apps/ and packages/ (.jscpd.json). Fails above the threshold in docs/adr/0014.
      - name: Duplicate code (jscpd)
        run: pnpm lint:dup

      # Unused files, exports and dependencies in every workspace project and the root (knip.jsonc, docs/adr/0017).
      - name: Unused code and dependencies (Knip)
        run: pnpm lint:unused

  # The scripts that need the tools from mise.lock, and the tests of tools/scripts that run those tools.
  scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same as before the split. Nothing here is known to need the history.
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # Installs the tools in mise.lock (checksum verified). `mise exec` in the scripts picks the pinned ones,
      # not the runner image's. No cache: a restored cache is not checked against the lock.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          cache: false

      # The pypi:semgrep sidecar lock (.mise/locks/pypi-semgrep) must be deterministic: regenerating it from
      # scratch must not change anything. mise.toml pins minimum_release_age to a fixed date for this; a
      # now-based duration would restamp exclude-newer every run and churn the lock (docs/adr/0021).
      - name: Semgrep lock is deterministic
        run: |
          rm -rf .mise/locks/pypi-semgrep
          mise lock pypi:semgrep --platform linux-x64
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff
            echo "::error::Regenerating the pypi:semgrep lock changed tracked files. minimum_release_age in mise.toml must be a fixed date, not a duration (docs/adr/0021)."
            exit 1
          fi

      - name: Lint shell scripts
        run: tools/scripts/sh/shellcheck.sh

      - name: Lint workflows (jactionlint, zizmor)
        run: tools/scripts/sh/lint-workflows.sh

      # Fails only on ERROR findings that this branch adds (docs/adr/0021). Fetches the Registry rules, so it needs the network.
      # In a pull request, GITHUB_BASE_REF names the base that the findings are compared with.
      - name: SAST (Semgrep, new findings only)
        run: node tools/scripts/src/checks/semgrep/cli.ts

      # Warns, never fails: dependency review (dependency-review.yml) is the gate for dependencies (docs/adr/0021).
      - name: Known vulnerabilities in dependencies (OSV-Scanner, warning only)
        run: tools/scripts/sh/osv-scanner.sh

      # Tests of tools/scripts that run a real tool from mise.lock on a real config of this repository.
      # Their inputs (package.json of tools/scripts) name each config they read, so affected sees the change.
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Tool tests (tools/scripts)
        run: pnpm exec nx affected -t test-tools

  # The projects (apps/ and packages/): check, test and build the ones that the change affects.
  nx:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx affected compares against the merge base.
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # A change to the code of an app must not make tools/scripts affected, or its tests run for
      # every app pull request (#158). It happens when a target of tools/scripts declares an input outside the
      # project that covers the apps, such as {workspaceRoot}/apps/**/*.
      - name: An app change does not affect tools/scripts
        run: |
          for file in apps/api/src/app.ts apps/web/src/main.tsx; do
            if pnpm exec nx show projects --affected --files="$file" | grep -qx scripts; then
              echo "::error::A change to $file makes the scripts project affected. Remove the input of tools/scripts/package.json (or nx.json) that covers it."
              exit 1
            fi
          done

      # The mutation target (Stryker) is not here: it runs weekly in mutation.yml (docs/adr/0031).
      # The name is the row of the assurance catalog (docs/tooling/assurance-catalog.md).
      - name: Check, test and build (nx affected)
        run: pnpm exec nx affected -t check test build

      # effect-tsgo on application and infrastructure of the modules: an Effect that is never run, and the Effect 3,
      # unstable and experimental APIs (oxlint.effect.json, docs/tooling/effect-lint.md, docs/adr/0028).
      - name: Effect checks (effect-tsgo, nx affected)
        run: pnpm exec nx affected -t lint-effect

      # Builds regenerate files such as apps/web/src/routeTree.gen.ts. They must be committed.
      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff
            echo "::error::The build changed tracked files. Run the build locally and commit the result."
            exit 1
          fi

  # The required status check. It keeps the name `main` that the ruleset refers to. `always()` makes it run
  # (and fail) when a job it needs failed or was cancelled; without it, the job would be skipped, and a
  # skipped required check counts as passing.
  main:
    needs: [checks, scripts, nx]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: A job that main needs did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A job that main needs did not succeed."
          exit 1

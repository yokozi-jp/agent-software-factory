name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # nrwl/nx-set-shas reads past workflow runs to find the last successful commit on main.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are for local development only.
  LEFTHOOK: "0"
  NX_NO_CLOUD: "true"
  # sha256 of shellcheck-v<version>.linux.x86_64.tar.gz (the asset digest on the GitHub release).
  # Update together with .shellcheck-version; a mismatch fails the checksum step (docs/adr/0008).
  SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"

jobs:
  main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx affected compares against the merge base.
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Repo policy (docs/adr)
        run: scripts/check-repo-policy.sh

      # The runner image ships its own shellcheck; the pinned one is put first on PATH.
      - name: Install shellcheck
        run: |
          SHELLCHECK_VERSION="$(tr -d '[:space:]' < .shellcheck-version)"
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint shell scripts
        run: scripts/shellcheck.sh

      # Behaviour tests for the Kiro hooks and the repo checks (scripts/test/). secret-scan.test.sh runs in secret-scan.yml.
      - name: Script tests
        run: |
          tests="scripts/test/kiro-hooks.test.sh scripts/test/repo-checks.test.sh scripts/test/guard-push.test.sh"
          # shellcheck disable=SC2086 # word splitting of $tests is intended
          sh scripts/test/run.sh $tests
          # shellcheck disable=SC2086
          sh scripts/test/isolation.test.sh $tests

      - name: Agent skills match skills-lock.json
        run: node scripts/verify-skills-lock.mjs

      - name: Lint Markdown
        run: pnpm lint:md

      - name: Docs bundle (OKF, links, orphans)
        run: scripts/docs-check.sh

      # Files outside apps/ and packages/ (root configs, scripts/, docs/, .github/). Nx checks the projects.
      - name: Check root files
        run: pnpm check:root

      - run: pnpm exec nx affected -t check test build

      # Builds regenerate files such as apps/web/src/routeTree.gen.ts. They must be committed.
      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff
            echo "::error::The build changed tracked files. Run the build locally and commit the result."
            exit 1
          fi

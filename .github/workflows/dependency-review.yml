name: Dependency review

# Fails a pull request that adds a dependency with a known vulnerability of high severity or above (docs/adr/0021).
# Vulnerabilities already on the base are Dependabot alerts, not failures. The job id is a required status check
# (.github/rulesets/protect-main.json). The action reads the dependency graph through the API, so no checkout is needed.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Ignore an advisory with allow-ghsas, and write the reason in a comment next to it.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The default is runtime only. Development dependencies (Nx, Vite+, the linters) run in CI and on
          # developer machines, so they are checked too (a judgement, docs/adr/0021).
          fail-on-scopes: runtime, development

name: Mutation

# Stryker on the pure functions of tools/scripts. It is not a required check: it takes minutes to tens of
# minutes and grows with the code, so it runs outside the pull request (docs/adr/0031, docs/tooling/ci.md).
on:
  schedule:
    # Mondays, 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Git hooks are for local development only.
  LEFTHOOK: "0"
  NX_NO_CLOUD: "true"

jobs:
  mutation:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # break is 100: one surviving mutant fails the run (tools/scripts/stryker.config.mjs).
      - name: Mutation (Stryker, tools/scripts)
        run: pnpm exec nx mutation scripts

name: Mutation

# Stryker on the pure functions of tools/scripts. It is not a required check: it takes minutes to tens of
# minutes and grows with the code, so it runs outside the pull request (docs/adr/0031, docs/tooling/ci.md).
# GitHub mails a failed scheduled run only to whoever last changed the cron line, and the run failed for twelve
# days without anyone reading it (#570), so a failed scheduled run also opens an issue (the report job).
on:
  schedule:
    # Every day, 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Git hooks are for local development only.
  LEFTHOOK: "0"
  NX_NO_CLOUD: "true"

jobs:
  mutation:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # break is 100: one surviving mutant fails the run (tools/scripts/stryker.config.mjs).
      - name: Mutation (Stryker, tools/scripts)
        run: pnpm exec nx mutation scripts

  # A failed scheduled run opens an issue, or comments on the open one, so that it is read where the work is
  # triaged. The issue carries only the link to the run: the log is not copied into it. Only the issues scope.
  report:
    needs: mutation
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: mutation.yml の毎日の実行が失敗している
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "また失敗した: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label needs-triage --body "mutation.yml の定期実行が失敗した: $RUN_URL

          次を確かめる (docs/adr/0031、docs/tooling/ci.md)。

          - 初回の実行 (dry run) が落ちた: sandbox の外のファイルを読む unit のテストを \`*.tools.test.ts\` に移す。
          - 生き残った mutant がある: その違いで失敗するテストを足す。等価な mutant だけ \`// Stryker disable next-line\` を書く。"
          fi

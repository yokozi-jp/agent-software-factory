name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tools come only from mise.lock (docs/adr/0009).
  MISE_LOCKED: "1"

jobs:
  betterleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs betterleaks from mise.lock (checksum and provenance verified). No cache: a restored cache is not checked against the lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.18
          cache: false

      - name: Test secret-scan.sh
        run: |
          sh scripts/test/run.sh scripts/test/secret-scan.test.sh
          sh scripts/test/isolation.test.sh scripts/test/secret-scan.test.sh

      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/secret-scan.sh range "$BASE_SHA" "$HEAD_SHA"

      - name: Scan full history
        if: github.event_name == 'push'
        run: scripts/secret-scan.sh all

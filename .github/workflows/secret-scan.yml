name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Git hooks are for local development only.
  LEFTHOOK: "0"
  NX_NO_CLOUD: "true"
  # Tools come only from mise.lock (docs/adr/0009).
  MISE_LOCKED: "1"

jobs:
  betterleaks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node.js for the scan (tools/scripts) and the dependencies for its tests.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          # No cache in this workflow, as for mise below.
          cache: false

      # Installs betterleaks from mise.lock (checksum and provenance verified). No cache: a restored cache is not checked against the lock.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22
          cache: false

      # The real betterleaks with .betterleaks.toml on a generated token (tools/scripts). Only the secret-scan
      # ones: the other tools tests (Semgrep) run in the scripts job of ci.yml.
      - name: Secret-scan tool tests (tools/scripts)
        working-directory: tools/scripts
        run: pnpm exec vp test run --project tools src/checks/secret-scan/

      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/scripts/src/checks/secret-scan/cli.ts range "$BASE_SHA" "$HEAD_SHA"

      - name: Scan full history
        if: github.event_name == 'push'
        run: node tools/scripts/src/checks/secret-scan/cli.ts all

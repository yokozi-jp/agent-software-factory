name: browser-probe
on:
  push:
    branches: [research/browser-mode-120]
permissions:
  contents: read
  actions: read
env:
  LEFTHOOK: "0"
  NX_NO_CLOUD: "true"
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - id: pw
        run: echo "version=$(pnpm --filter @agent-software-factory/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (browser only, cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: time pnpm --filter @agent-software-factory/web exec playwright install --with-deps chromium
      - name: Install system deps only (cache hit)
        if: steps.cache.outputs.cache-hit == 'true'
        run: time pnpm --filter @agent-software-factory/web exec playwright install-deps chromium
      - name: Test via nx
        run: time pnpm exec nx run web:test
      - name: Coverage
        run: pnpm --filter @agent-software-factory/web exec vp test run --coverage || true

name: Release

# Manual release with nx release (docs/repository/release.md).
# Versions come from Conventional Commits; each project gets its own tag, CHANGELOG.md and GitHub Release.
# Nothing is published to npm.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only (no commit, tag or GitHub Release)"
        type: boolean
        default: true
      first-release:
        description: "First release (no previous tags exist yet)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  LEFTHOOK: "0"
  NX_NO_CLOUD: "true"

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Push the release commit and tags, and create GitHub Releases.
      contents: write
    steps:
      # nx release pushes the release commit and tags with the credentials checkout persists.
      # No step uploads artifacts, so .git/config cannot leak through one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] nx release pushes with these credentials; no step uploads artifacts
          fetch-depth: 0
          fetch-tags: true

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # GITHUB_TOKEN cannot bypass the main ruleset, so a real release would fail at its final push,
      # after creating the commit locally. Stop before that while main requires pull requests (issue #12).
      - name: Stop if main only accepts pull requests
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Fails the step if the API call fails, instead of releasing without knowing.
          requires_pr="$(gh api "repos/$REPO/rules/branches/main" --jq 'any(.[]; .type == "pull_request")')"
          if [ "$requires_pr" != "false" ]; then
            echo "::error::main only accepts pull requests (ruleset), so this workflow cannot push the release commit. See https://github.com/$REPO/issues/12 and docs/repository/release.md."
            exit 1
          fi

      - name: nx release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
          FIRST_RELEASE: ${{ inputs.first-release }}
        run: |
          args="--skip-publish --verbose"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          if [ "$FIRST_RELEASE" = "true" ]; then args="$args --first-release"; fi
          # shellcheck disable=SC2086 # $args is a list of flags and must be split
          pnpm exec nx release $args

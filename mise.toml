# CLI tools for Git hooks and CI, installed by mise (docs/adr/0009).
# Only [tools] with exact versions: Node.js and pnpm belong to Vite+, tasks to Nx.
# After changing a version, run `mise lock --platform linux-x64` and commit mise.lock.
[tools]
"aqua:jdx/jactionlint" = "2.5.0"
"aqua:stoplightio/spectral" = "6.17.1"
# Must equal betterleaksMinVersion in .betterleaks.toml (checked by tools/scripts/src/checks/repo-policy/cli.ts). v1 only (docs/adr/0003).
betterleaks = "1.10.1"
"github:oasdiff/oasdiff" = "v1.37.0"
osv-scanner = "2.7.1"
# Semgrep CE is only on PyPI. uv installs it from the dependency graph that mise.lock records (wheel hashes),
# with the Python pinned here, so it does not depend on the Python of the machine (docs/adr/0021).
"pypi:semgrep" = "1.184.0"
python = "3.13.17"
shellcheck = "0.11.0"
uv = "0.13.8"
zizmor = "1.32.0"

# Kiro CLI has no mise registry entry, so the http backend downloads the official zip (docs/adr/0057).
# The version list and the sha256 of every package are in the official index.json; mise.lock records the sha256.
# renovate.jsonc has a regex manager that reads the `version` line right under this table header, so keep them adjacent.
[tools."http:kiro-cli"]
version = "3.2.1"
bin_path = "kirocli/bin"
checksum_url = "https://prod.download.cli.kiro.dev/stable/index.json"
checksum_expr = '"sha256:" + filter(filter(fromJSON(body).versions, { #.version == version })[0].packages, { #.download == version + "/" + filename })[0].sha256'

[tools."http:kiro-cli".platforms]
linux-x64 = { url = "https://prod.download.cli.kiro.dev/stable/{{ version }}/kirocli-x86_64-linux.zip" }

[settings]
# minimum_release_age は供給網リスク対策の cooldown (新しすぎる版を避ける) です (docs/adr/0021)。
# 既定の "24h" は duration で now を基準にするため、pypi backend が uv に渡す exclude-newer が
# sidecar の uv.lock を作り直すたびに now-24h の絶対時刻で焼き直され、semgrep の版を固定していても
# digest が毎回変わり、lock file maintenance の PR が繰り返し作られていました。
# cooldown は保ったまま lock を決定論にするため、now 基準の duration ではなく固定日時にします。
# 2026-11-10 は semgrep 1.184.0 を mise.toml で固定した日です。版を上げるときにこの日付も進めます。
minimum_release_age = "2026-11-10T00:00:00Z"

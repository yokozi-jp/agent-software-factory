# CLI tools for Git hooks and CI, installed by mise (docs/adr/0009).
# Only [tools] with exact versions: Node.js and pnpm belong to Vite+, tasks to Nx.
# After changing a version, run `mise lock --platform linux-x64` and commit mise.lock.
[tools]
# Must equal betterleaksMinVersion in .betterleaks.toml (checked by scripts/check-repo-policy.sh). v1 only (docs/adr/0003).
betterleaks = "1.9.0"
shellcheck = "0.11.0"

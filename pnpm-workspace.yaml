packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@effect/tsgo": 0.61.0
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@commitlint/config-nx-scopes": ^21.2.3
  "@commitlint/types": ^21.2.3
  "@hono/node-server": ^2.1.5
  "@hono/vite-dev-server": ^0.26.1
  "@tanstack/react-router": ^1.170.45
  "@tanstack/router-plugin": ^1.168.47
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  effect: ^4.0.6
  hono: ^4.13.13
  lefthook: ^2.2.2
  nx: 24.0.1
  "@nx/js": 24.0.1
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  markdownlint-cli2: 0.24.0
  jscpd: 5.4.2
  "@iwe-org/iwe": 0.29.1
  knip: 6.43.0
  eslint-plugin-react-you-might-not-need-an-effect: 1.0.2
  better-auth: ^1.7.12
  pg: ^8.23.1
  dbmate: 2.37.0
  # Inside the peer range of Better Auth (^0.28.17 || ^0.29.0), so it and the code share one copy of kysely.
  kysely: ^0.29.7
  # Pinned: the generated types are committed, and a new version may write them differently (docs/adr/0025).
  kysely-codegen: 0.20.0
  "@testcontainers/postgresql": ^12.2.1
  "@types/pg": ^8.23.1
  testcontainers: ^12.2.1
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@vitest/coverage-v8": 5.0.5
  smol-toml: 1.9.1
  yaml: 2.9.1
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  nx: true
  # Git hooks are installed by the root `prepare` script, not by lefthook's postinstall.
  lefthook: false
  # testcontainers の依存。build script を実行しない。実行しなくても api のテストは通る
  # (Docker のソケットを使い、ssh 経由の接続は使わない)。CI の pnpm は、判断のない build script を失敗にする。
  cpu-features: false
  protobufjs: false
  ssh2: false
# nx 24.0.0 was younger than pnpm's minimumReleaseAge when added by `nx init`.
# Remove these entries once the version is old enough.
minimumReleaseAgeExclude:
  - "@nx/nx-darwin-arm64@24.0.0"
  - "@nx/nx-darwin-x64@24.0.0"
  - "@nx/nx-freebsd-x64@24.0.0"
  - "@nx/nx-linux-arm-gnueabihf@24.0.0"
  - "@nx/nx-linux-arm64-gnu@24.0.0"
  - "@nx/nx-linux-arm64-musl@24.0.0"
  - "@nx/nx-linux-x64-gnu@24.0.0"
  - "@nx/nx-linux-x64-musl@24.0.0"
  - "@nx/nx-win32-arm64-msvc@24.0.0"
  - "@nx/nx-win32-x64-msvc@24.0.0"
  - nx@24.0.0
  - "@nx/devkit@24.0.0"
  - "@nx/js@24.0.0"
  - "@nx/workspace@24.0.0"
  # @effect/tsgo 0.61.0 (published 2026-10-26) was younger than minimumReleaseAge when added (docs/adr/0028). It is
  # pinned to the Oxlint of Vite+ (docs/tooling/effect-lint.md). Remove these entries once the version is old enough.
  - "@effect/tsgo-darwin-arm64@0.61.0"
  - "@effect/tsgo-darwin-x64@0.61.0"
  - "@effect/tsgo-linux-arm64@0.61.0"
  - "@effect/tsgo-linux-arm@0.61.0"
  - "@effect/tsgo-linux-x64@0.61.0"
  - "@effect/tsgo-win32-arm64@0.61.0"
  - "@effect/tsgo-win32-x64@0.61.0"
  - "@effect/tsgo@0.61.0"

packages:
  - apps/*
  - packages/*
  - packages/*/events
  - tools/*

catalogMode: prefer

catalog:
  "@effect/tsgo": 0.63.0
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@commitlint/config-nx-scopes": ^21.2.3
  "@commitlint/types": ^21.2.3
  "@hono/node-server": ^2.1.5
  # apps/api: the routes are written with createRoute and the OpenAPI 3.1 spec is generated from them (docs/adr/0047). Zod only.
  "@hono/zod-openapi": ^1.6.3
  "@hono/vite-dev-server": ^0.26.1
  "@tanstack/react-query": ^5.105.0
  "@tanstack/react-router": ^1.170.45
  "@tanstack/router-plugin": ^1.168.47
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  effect: ^4.0.6
  hono: ^4.13.13
  lefthook: ^2.2.2
  nx: 24.0.2
  "@nx/js": 24.0.2
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  markdownlint-cli2: 0.24.0
  jscpd: 5.4.2
  "@iwe-org/iwe": 0.29.1
  knip: 6.43.0
  eslint-plugin-react-you-might-not-need-an-effect: 1.0.2
  better-auth: ^1.7.12
  oidc-provider: ^9.13.3
  "@types/oidc-provider": ^9.13.1
  pg: ^8.23.1
  dbmate: 2.37.0
  # Inside the peer range of Better Auth (^0.28.17 || ^0.29.0), so it and the code share one copy of kysely.
  kysely: ^0.29.7
  # The seed of packages/db generates the rows that grow in number (docs/adr/0036). A devDependency: production does not import it.
  "@faker-js/faker": ^10.6.0
  # Pinned: the generated types are committed, and a new version may write them differently (docs/adr/0025).
  kysely-codegen: 0.20.0
  "@testcontainers/postgresql": ^12.2.1
  "@types/pg": ^8.23.1
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@vitest/coverage-v8": 5.0.5
  smol-toml: 1.9.1
  yaml: 2.9.1
  zod: ^4.6.7
  # OpenTelemetry (docs/adr/0048). Only packages/telemetry and the entry files of the apps import the SDK; the rest import
  # @opentelemetry/api. sdk-node is on the experimental 0.3xx line, so a minor update may change its options.
  "@opentelemetry/api": ^1.10.0
  "@opentelemetry/sdk-node": ^0.300.0
  "@opentelemetry/sdk-trace": ^3.0.0
  "@opentelemetry/instrumentation-pg": ^0.77.0
  "@opentelemetry/instrumentation-undici": ^0.34.0
  "@opentelemetry/instrumentation-aws-sdk": ^0.79.0
  "@hono/otel": ^1.3.0
  # Logging (docs/adr/0049): only packages/logging/src/node.ts and the entry files of the apps import pino; the rest depend on the Logger interface.
  pino: ^10.4.0
  # The Temporal global for Node.js 24 and the browsers without it. Node.js 26 has it built in.
  temporal-polyfill: 1.0.6
  # apps/worker: the workers of the queues (docs/adr/0013, docs/adr/0041). The SQS and SES clients are for the ECS and Lambda
  # workers; nodemailer sends to Mailpit in the local environment and CI. testcontainers starts ElasticMQ and Mailpit.
  "@aws-sdk/client-sqs": ^3.1150.0
  "@aws-sdk/client-sesv2": ^3.1150.0
  nodemailer: ^10.3.1
  "@types/nodemailer": ^8.0.2
  "@types/aws-lambda": ^8.10.164
  testcontainers: ^12.2.1
  # apps/web: Vitest browser mode with Playwright, to test display in a browser with a time zone of its own (docs/adr/0043).
  "@vitest/browser-playwright": 5.0.5
  playwright: 1.64.1
  # apps/web and packages/ui: Tailwind CSS v4 and the dependencies `shadcn init` added (docs/adr/0033, 0034).
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  lucide-react: ^1.62.0
  shadcn: ^4.22.1
  tw-animate-css: ^1.4.0
  # apps/web and packages/i18n: the text of the screens (docs/adr/0044). i18next-cli is pinned, as it is the key check of the gate.
  i18next: ^26.5.11
  react-i18next: ^17.1.9
  i18next-cli: 1.80.5
  "@storybook/addon-a11y": ^10.6.5
  "@storybook/addon-vitest": ^10.6.5
  "@storybook/react-vite": ^10.6.5
  storybook: ^10.6.5
  eslint-plugin-storybook: ^10.6.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  nx: true
  # Storybook (apps/web) の依存。esbuild の build script を実行する。実行しないと、CI の pnpm が判断のない build script として失敗にする。
  esbuild: true
  # Git hooks are installed by the root `prepare` script, not by lefthook's postinstall.
  lefthook: false
  # testcontainers の依存。build script を実行しない。実行しなくても api のテストは通る
  # (Docker のソケットを使い、ssh 経由の接続は使わない)。CI の pnpm は、判断のない build script を失敗にする。
  cpu-features: false
  protobufjs: false
  ssh2: false
  # i18next-cli の依存。postinstall は実行しない。ネイティブの binary は optionalDependencies の別 package で入る。
  "@swc/core": false
# nx 24.0.0 was younger than pnpm's minimumReleaseAge when added by `nx init`.
# Remove these entries once the version is old enough.
minimumReleaseAgeExclude:
  - "@nx/nx-darwin-arm64@24.0.0"
  - "@nx/nx-darwin-x64@24.0.0"
  - "@nx/nx-freebsd-x64@24.0.0"
  - "@nx/nx-linux-arm-gnueabihf@24.0.0"
  - "@nx/nx-linux-arm64-gnu@24.0.0"
  - "@nx/nx-linux-arm64-musl@24.0.0"
  - "@nx/nx-linux-x64-gnu@24.0.0"
  - "@nx/nx-linux-x64-musl@24.0.0"
  - "@nx/nx-win32-arm64-msvc@24.0.0"
  - "@nx/nx-win32-x64-msvc@24.0.0"
  - nx@24.0.0
  - "@nx/devkit@24.0.0"
  - "@nx/js@24.0.0"
  - "@nx/workspace@24.0.0"
  # @effect/tsgo 0.61.0 (published 2026-10-26) was younger than minimumReleaseAge when added (docs/adr/0028). It is
  # pinned to the Oxlint of Vite+ (docs/tooling/effect-lint.md). Remove these entries once the version is old enough.
  - "@effect/tsgo-darwin-arm64@0.61.0"
  - "@effect/tsgo-darwin-x64@0.61.0"
  - "@effect/tsgo-linux-arm64@0.61.0"
  - "@effect/tsgo-linux-arm@0.61.0"
  - "@effect/tsgo-linux-x64@0.61.0"
  - "@effect/tsgo-win32-arm64@0.61.0"
  - "@effect/tsgo-win32-x64@0.61.0"
  - "@effect/tsgo@0.61.0"
  - oidc-provider@9.13.3
  - "@types/oidc-provider@9.13.1"

packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@commitlint/config-nx-scopes": ^21.2.3
  "@commitlint/types": ^21.2.3
  "@hono/node-server": ^2.1.5
  "@hono/vite-dev-server": ^0.26.1
  "@tanstack/react-router": ^1.170.45
  "@tanstack/router-plugin": ^1.168.47
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  hono: ^4.13.13
  lefthook: ^2.2.2
  nx: 24.0.0
  "@nx/js": 24.0.0
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  markdownlint-cli2: 0.24.0
  jscpd: 5.4.2
  "@iwe-org/iwe": 0.29.0
  knip: 6.42.1
  better-auth: ^1.7.12
  pg: ^8.23.1
  "@testcontainers/postgresql": ^12.2.1
  "@types/pg": ^8.23.1
  testcontainers: ^12.2.1
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@vitest/coverage-v8": 5.0.5
  smol-toml: 1.9.1
  yaml: 2.9.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  nx: true
  # Git hooks are installed by the root `prepare` script, not by lefthook's postinstall.
  lefthook: false
  # testcontainers の依存。build script を実行しない。実行しなくても api のテストは通る
  # (Docker のソケットを使い、ssh 経由の接続は使わない)。CI の pnpm は、判断のない build script を失敗にする。
  cpu-features: false
  protobufjs: false
  ssh2: false
# nx 24.0.0 was younger than pnpm's minimumReleaseAge when added by `nx init`.
# Remove these entries once the version is old enough.
minimumReleaseAgeExclude:
  - "@nx/nx-darwin-arm64@24.0.0"
  - "@nx/nx-darwin-x64@24.0.0"
  - "@nx/nx-freebsd-x64@24.0.0"
  - "@nx/nx-linux-arm-gnueabihf@24.0.0"
  - "@nx/nx-linux-arm64-gnu@24.0.0"
  - "@nx/nx-linux-arm64-musl@24.0.0"
  - "@nx/nx-linux-x64-gnu@24.0.0"
  - "@nx/nx-linux-x64-musl@24.0.0"
  - "@nx/nx-win32-arm64-msvc@24.0.0"
  - "@nx/nx-win32-x64-msvc@24.0.0"
  - nx@24.0.0
  - "@nx/devkit@24.0.0"
  - "@nx/js@24.0.0"
  - "@nx/workspace@24.0.0"

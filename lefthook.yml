# Git hooks. Installed by `pnpm install` (root `prepare` script runs `lefthook install`).
# Docs: https://lefthook.dev/configuration/
# Why lefthook instead of Vite+ hooks: docs/adr/0001-lefthook-for-git-hooks.md

# Hook commands invoke `betterleaks` from PATH. It is not an npm package; see docs/development-setup.md.

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: scripts/betterleaks.sh git --staged --redact --no-banner --config .betterleaks.toml .
    # Lint Markdown only after the formatter has rewritten the staged files.
    - name: format-and-lint
      group:
        piped: true
        jobs:
          - name: check
            glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,css,html,yml,yaml}"
            exclude:
              - ".kiro/**"
              - "**/routeTree.gen.ts"
            run: pnpm exec vp check --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: markdownlint
            glob: "*.md"
            run: pnpm exec markdownlint-cli2 {staged_files}
    - name: skills-lock
      glob:
        - ".kiro/**"
        - "skills-lock.json"
      run: node scripts/verify-skills-lock.mjs
    - name: repo-policy
      glob:
        - "**/package.json"
        - "**/vite.config.ts"
        - ".vite-hooks/**"
        - ".betterleaks.toml"
        - ".betterleaks-version"
      run: scripts/check-repo-policy.sh

pre-push:
  commands:
    secrets:
      # Scan only the commits being pushed. Git passes "<local ref> <local sha> <remote ref> <remote sha>" on stdin.
      run: scripts/betterleaks-pre-push.sh
      use_stdin: true

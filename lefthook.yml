# Git hooks. Installed by `pnpm install` (root `prepare` script runs `lefthook install`).
# Docs: https://lefthook.dev/configuration/
# Why lefthook instead of Vite+ hooks: docs/adr/0001-lefthook-for-git-hooks.md

# scripts/secret-scan.sh, scripts/shellcheck.sh and scripts/lint-workflows.sh run their linters through `mise exec`,
# so the tools pinned in mise.toml must be installed (`mise install --locked`, docs/local-env-setup/setup.md).

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: secret-scan
      run: scripts/secret-scan.sh staged
    # Lint Markdown only after the formatter has rewritten the staged files.
    - name: format-and-lint
      group:
        piped: true
        jobs:
          - name: check
            glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,css,html,yml,yaml}"
            exclude:
              - ".agents/**"
              - ".kiro/skills/**"
              - "**/routeTree.gen.ts"
            run: pnpm exec vp check --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: markdownlint
            glob: "*.md"
            run: pnpm exec markdownlint-cli2 {staged_files}
    - name: docs-check
      glob:
        - "docs/**"
        - "scripts/docs-check.sh"
        - "scripts/docs-links.mjs"
      run: scripts/docs-check.sh staged
    - name: shellcheck
      glob:
        - "*.sh"
        - "mise.toml"
        - "mise.lock"
      run: scripts/shellcheck.sh
    # actionlint also runs shellcheck on run: scripts, so a shellcheck upgrade (mise.toml) re-checks workflows too.
    - name: lint-workflows
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - "scripts/lint-workflows.sh"
        - "mise.toml"
        - "mise.lock"
      run: scripts/lint-workflows.sh
    # jscpd scans the working tree as a whole (.jscpd.json), since a clone spans files you did not stage.
    # pnpm-workspace.yaml pins the jscpd version, so an upgrade re-runs the check.
    - name: duplicate-code
      glob:
        - "apps/**"
        - "packages/**"
        - ".jscpd.json"
        - "pnpm-workspace.yaml"
      run: pnpm lint:dup
    - name: skills-lock
      glob:
        - ".agents/**"
        - ".kiro/skills/**"
        - "skills-lock.json"
        - "scripts/verify-skills-lock.mjs"
      run: node scripts/verify-skills-lock.mjs
    # Behaviour tests (scripts/test/) for the scripts and Kiro hooks that changed.
    - name: kiro-hooks-test
      glob:
        - ".kiro/hooks/*.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/kiro-hooks.test.sh"
      run: sh scripts/test/run.sh scripts/test/kiro-hooks.test.sh
    - name: repo-checks-test
      glob:
        - "scripts/check-repo-policy.sh"
        - "scripts/docs-check.sh"
        - "scripts/docs-links.mjs"
        - "scripts/test/lib.sh"
        - "scripts/test/repo-checks.test.sh"
      run: sh scripts/test/run.sh scripts/test/repo-checks.test.sh
    - name: secret-scan-test
      glob:
        - "scripts/secret-scan.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/secret-scan.test.sh"
      run: sh scripts/test/run.sh scripts/test/secret-scan.test.sh
    # Tests run from this hook with GIT_DIR set; isolation.test.sh proves they still stay in their sandbox.
    # Only lib.sh decides isolation, so this runs when it changes. CI runs it for every change.
    - name: isolation-test
      glob:
        - "scripts/test/lib.sh"
        - "scripts/test/isolation.test.sh"
      run: sh scripts/test/run.sh scripts/test/isolation.test.sh
    - name: guard-push-test
      glob:
        - "scripts/guard-push.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/guard-push.test.sh"
      run: sh scripts/test/run.sh scripts/test/guard-push.test.sh
    - name: lint-workflows-test
      glob:
        - "scripts/lint-workflows.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/lint-workflows.test.sh"
        # The test copies them, and a new linter version can change what it reports.
        - "mise.toml"
        - "mise.lock"
      run: sh scripts/test/run.sh scripts/test/lint-workflows.test.sh
    - name: duplicate-code-test
      glob:
        - ".jscpd.json"
        - ".gitignore"
        - "scripts/test/lib.sh"
        - "scripts/test/duplicate-code.test.sh"
        # A new jscpd version (pinned in the catalog) can change what it reports.
        - "pnpm-workspace.yaml"
      run: sh scripts/test/run.sh scripts/test/duplicate-code.test.sh
    - name: adr-number-test
      glob:
        - "scripts/check-adr-number.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/adr-number.test.sh"
      run: sh scripts/test/run.sh scripts/test/adr-number.test.sh
    - name: repo-policy
      glob:
        - "**/package.json"
        - "**/vite.config.ts"
        - ".vite-hooks/**"
        - ".betterleaks.toml"
        - "mise.toml"
        - ".kiro/steering/**"
        - "scripts/check-repo-policy.sh"
        # Plain-text references to docs/ live in these files. "*.md" matches Markdown at any depth (AGENTS.md, README.md ...).
        - "*.md"
        - "lefthook.yml"
        - ".github/**"
        - ".kiro/hooks/**"
        - "scripts/**"
        - "docs/**"
        - "**/*.ts"
      # Check what is staged, so unstaged edits to other files cannot fail the commit.
      run: scripts/check-repo-policy.sh staged

pre-push:
  commands:
    guard-push:
      run: scripts/guard-push.sh
      use_stdin: true
    secret-scan:
      # Scan only the commits being pushed. Git passes "<local ref> <local sha> <remote ref> <remote sha>" on stdin.
      run: scripts/secret-scan.sh pre-push
      use_stdin: true

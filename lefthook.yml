# Git hooks. Installed by `pnpm install` (root `prepare` script runs `lefthook install`).
# Docs: https://lefthook.dev/configuration/
# Why lefthook instead of Vite+ hooks: docs/adr/0001-lefthook-for-git-hooks.md

# secret-scan, semgrep (tools/scripts/src/checks/), tools/scripts/sh/shellcheck.sh and tools/scripts/sh/lint-workflows.sh run their
# linters through `mise exec`, so the tools pinned in mise.toml must be installed (`mise install --locked`, docs/local-env-setup/setup.md).

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: secret-scan
      run: node tools/scripts/src/checks/secret-scan/cli.ts staged
    # Lint Markdown only after the formatter has rewritten the staged files.
    - name: format-and-lint
      group:
        piped: true
        jobs:
          - name: check
            glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,css,html,yml,yaml}"
            exclude:
              - ".agents/**"
              - ".kiro/skills/**"
              - "**/routeTree.gen.ts"
            run: pnpm exec vp check --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: markdownlint
            glob: "*.md"
            run: pnpm exec markdownlint-cli2 {staged_files}
    # pnpm-workspace.yaml pins iwe, so an upgrade re-checks docs/.
    - name: docs-check
      glob:
        - "docs/**"
        - "tools/scripts/src/checks/docs-check/*.ts"
        - "tools/scripts/src/checks/json.ts"
        - "pnpm-workspace.yaml"
      run: node tools/scripts/src/checks/docs-check/cli.ts staged
    - name: shellcheck
      glob:
        - "*.sh"
        - "mise.toml"
        - "mise.lock"
      run: tools/scripts/sh/shellcheck.sh
    # jactionlint also runs shellcheck on run: scripts, so a shellcheck upgrade (mise.toml) re-checks workflows too.
    - name: lint-workflows
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/jactionlint.yaml"
        - "tools/scripts/sh/lint-workflows.sh"
        - "mise.toml"
        - "mise.lock"
      run: tools/scripts/sh/lint-workflows.sh
    # jscpd scans the working tree as a whole (.jscpd.json), since a clone spans files you did not stage.
    # pnpm-workspace.yaml pins the jscpd version, so an upgrade re-runs the check.
    - name: duplicate-code
      glob:
        - "apps/**"
        - "packages/**"
        - ".jscpd.json"
        - "pnpm-workspace.yaml"
      run: pnpm lint:dup
    # Knip reads every workspace project and the root. Besides code, it reads what names dependencies and entries:
    # package.json scripts, workflows, lefthook.yml, the configs of the tools it has plugins for (nx.json, mise.toml,
    # .markdownlint-cli2.yaml ...), and the files behind the exceptions in knip.jsonc.
    - name: unused-code
      glob:
        - "*.{js,cjs,mjs,jsx,ts,cts,mts,tsx}"
        - "**/package.json"
        - "**/tsconfig.json"
        - "knip.jsonc"
        - "pnpm-workspace.yaml"
        - "lefthook.yml"
        - ".github/workflows/*.{yml,yaml}"
        - "nx.json"
        - "mise.toml"
        - ".markdownlint-cli2.yaml"
        - ".kiro/settings/mcp.json"
      run: pnpm lint:unused
    - name: skills-lock
      glob:
        - ".agents/**"
        - ".kiro/skills/**"
        - "skills-lock.json"
        - "tools/scripts/src/checks/skills-lock/*.ts"
        - "tools/scripts/src/checks/json.ts"
      run: node tools/scripts/src/checks/skills-lock/cli.ts
    # Runs the Renovate pinned in tools/scripts/sh/renovate.sh through `pnpm dlx`, so it needs the network.
    - name: renovate-config
      glob:
        - "renovate.jsonc"
        - "tools/scripts/sh/renovate.sh"
      run: tools/scripts/sh/renovate.sh validate
    # The checks and hooks written in TypeScript (tools/scripts). Nx skips the run when the cached result
    # still holds. Besides the project, the tests depend on the files in `sharedGlobals` of nx.json:
    # pnpm-workspace.yaml pins Vitest and the other tools, the root vite.config.ts holds the
    # no-restricted-imports override the fixture checks, and tsconfig.json and .node-version set the
    # compiler and the runtime. Keep this list in step with `sharedGlobals`, and with the inputs of the
    # `test` target in tools/scripts/package.json (.kiro/hooks/*.json, which kiro-hooks.test.ts reads).
    - name: scripts-test
      glob:
        - "tools/scripts/**"
        - "pnpm-workspace.yaml"
        - "vite.config.ts"
        - "tsconfig.json"
        - ".node-version"
        - ".kiro/hooks/*.json"
      run: pnpm exec nx test scripts
    # The tests that run a real tool from mise.lock on a real config (*.tools.test.ts). They take minutes, so
    # the glob is narrower than the project: the inputs of the test-tools target (tools/scripts/package.json)
    # that are not the project (a new betterleaks or Semgrep version, or Semgrep's dependency graph in
    # .mise/locks/, can change what they report), the tools tests, the checks and shell wrappers that have
    # them, the configs they try (the Knip test also reads other root files, which CI covers
    # with `nx affected -t test-tools`), the test helpers and the config that run them, and `sharedGlobals`.
    # CI still runs them for every change to the project. Each input of the target in tools/scripts/package.json
    # is a glob here too, written the same way; repo-policy checks it (inputs left out on purpose are in its notInHook).
    - name: scripts-test-tools
      glob:
        - ".betterleaks.toml"
        - ".github/jactionlint.yaml"
        - ".github/workflows/ci.yml"
        - ".gitignore"
        - ".jscpd.json"
        - ".markdownlint-cli2.yaml"
        - "commitlint.config.ts"
        - "knip.jsonc"
        - "renovate.jsonc"
        - "tools/scripts/sh/**"
        - "mise.toml"
        - "mise.lock"
        - ".mise/locks/**/*"
        - "tools/scripts/src/**/*.tools.test.ts"
        - "tools/scripts/src/checks/secret-scan/**"
        - "tools/scripts/src/checks/semgrep/**"
        - "tools/scripts/src/checks/docs-check/**"
        - "docs/.iwe/config.toml"
        - "docs/.iwe/schemas/okf.yaml"
        - "docs/.iwe/schemas/okf-index.yaml"
        - "docs/.iwe/schemas/okf-log.yaml"
        - "tools/scripts/src/test/isolation.ts"
        - "tools/scripts/src/test/sandbox.ts"
        - "tools/scripts/src/test/setup.ts"
        - "tools/scripts/vite.config.ts"
        - "tools/scripts/package.json"
        - "pnpm-workspace.yaml"
        - "vite.config.ts"
        - "tsconfig.json"
        - ".node-version"
      run: pnpm exec nx test-tools scripts
    - name: repo-policy
      glob:
        - "**/package.json"
        - "**/vite.config.ts"
        - ".vite-hooks/**"
        - ".betterleaks.toml"
        - "mise.toml"
        - ".kiro/steering/**"
        - "tools/scripts/src/checks/repo-policy/**"
        # The Node.js major (docs/adr/0013). The catalog also pins the parsers that repo-policy uses.
        - ".node-version"
        - "pnpm-workspace.yaml"
        # Plain-text references to docs/ live in these files. "*.md" matches Markdown at any depth (AGENTS.md, README.md ...).
        - "*.md"
        - "lefthook.yml"
        - ".github/**"
        - ".kiro/hooks/**"
        - "tools/scripts/sh/**"
        - "docs/**"
        - "**/*.ts"
      # Check what is staged, so unstaged edits to other files cannot fail the commit.
      run: node tools/scripts/src/checks/repo-policy/cli.ts staged

pre-push:
  commands:
    guard-push:
      run: tools/scripts/sh/guard-push.sh
      use_stdin: true
    secret-scan:
      # Scan only the commits being pushed. Git passes "<local ref> <local sha> <remote ref> <remote sha>" on stdin.
      run: node tools/scripts/src/checks/secret-scan/cli.ts pre-push
      use_stdin: true
    # Warns only (docs/adr/0016). Silence it with ADR_ACK=1 for a change that needs no ADR.
    adr-check:
      run: node tools/scripts/src/checks/adr-check/cli.ts pre-push
      use_stdin: true
    # Two open PRs can take the same ADR number (docs/tooling/worktrees.md ("PR を出す")).
    # Exit 1 (number taken) stops the push. Exit 2 (gh could not list the PRs) only prints its message, so being offline does not block a push.
    adr-number:
      run: node tools/scripts/src/checks/check-adr-number/cli.ts || [ $? -ne 1 ]
    # The same SAST as CI, so an agent sees a new finding before the pull request (docs/adr/0021).
    # Fails only on ERROR findings that the branch adds to origin/main. Needs the network for the Registry rules.
    # Exit 1 (a new finding) stops the push. Exit 2 or more (could not scan: offline, no fetch) only prints its message.
    semgrep:
      run: node tools/scripts/src/checks/semgrep/cli.ts || [ $? -ne 1 ]
    # Warns only. dependency review in CI is the gate for dependencies (docs/adr/0021).
    osv-scanner:
      run: tools/scripts/sh/osv-scanner.sh

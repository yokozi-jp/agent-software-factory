# Git hooks. Installed by `pnpm install` (root `prepare` script runs `lefthook install`).
# Docs: https://lefthook.dev/configuration/
# Why lefthook instead of Vite+ hooks: docs/adr/0001-lefthook-for-git-hooks.md

# secret-scan, semgrep (tools/scripts/src/checks/), tools/scripts/sh/shellcheck.sh and tools/scripts/sh/lint-workflows.sh run their
# linters through `mise exec`, so the tools pinned in mise.toml must be installed (`mise install --locked`, docs/local-env-setup/setup.md).

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  # Three stages, run in order, each in parallel: quick-checks, checks, then the Nx tasks. If a stage fails, the
  # commit stops before the next stage starts. With every job in one parallel stage, lefthook waits for the slowest job
  # (scripts-test, over 2 minutes) before it reports a failure that came in seconds (e.g. jscpd).
  # The Nx tasks (scripts-test, db-types, lint-effect) are the jobs that can take minutes; Nx skips them when its
  # cached result still holds, and their globs skip them when nothing they read changed.
  piped: true
  jobs:
    # The checks that finish in seconds (secret-scan 7 s, jscpd 7 s, repo-policy 22 s; docs-check, vp check and Knip
    # take 2 to 2.5 minutes). A parallel group reports a failure only after its slowest job, so a clone that jscpd finds in seconds
    # waited for Knip. These run first; if one fails, the commit stops before the slow checks start.
    - name: quick-checks
      group:
        parallel: true
        jobs:
          - name: secret-scan
            run: node tools/scripts/src/checks/secret-scan/cli.ts staged
          # jscpd scans the working tree as a whole (.jscpd.json), since a clone spans files you did not stage.
          # pnpm-workspace.yaml pins the jscpd version, so an upgrade re-runs the check.
          - name: duplicate-code
            glob:
              - "apps/**"
              - "packages/**"
              - ".jscpd.json"
              - "pnpm-workspace.yaml"
            run: pnpm lint:dup
          - name: repo-policy
            glob:
              - "**/package.json"
              - "**/vite.config.ts"
              - ".vite-hooks/**"
              - ".betterleaks.toml"
              - "mise.toml"
              - ".kiro/steering/**"
              - "tools/scripts/src/checks/repo-policy/**"
              # The Node.js major (docs/adr/0013). The catalog also pins the parsers that repo-policy uses.
              - ".node-version"
              - "pnpm-workspace.yaml"
              # Plain-text references to docs/ live in these files. "*.md" matches Markdown at any depth (AGENTS.md, README.md ...).
              - "*.md"
              - "lefthook.yml"
              - ".github/**"
              - ".kiro/hooks/**"
              - "tools/scripts/sh/**"
              - "docs/**"
              - "**/*.ts"
            # Check what is staged, so unstaged edits to other files cannot fail the commit.
            run: node tools/scripts/src/checks/repo-policy/cli.ts staged

    - name: checks
      group:
        parallel: true
        jobs:
          # Lint Markdown only after the formatter has rewritten the staged files.
          - name: format-and-lint
            group:
              piped: true
              jobs:
                - name: check
                  glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,css,html,yml,yaml}"
                  exclude:
                    - ".agents/**"
                    - ".kiro/skills/**"
                    - "**/routeTree.gen.ts"
                  run: pnpm exec vp check --fix --no-error-on-unmatched-pattern {staged_files}
                  stage_fixed: true
                - name: markdownlint
                  glob: "*.md"
                  run: pnpm exec markdownlint-cli2 {staged_files}
          # pnpm-workspace.yaml pins iwe, so an upgrade re-checks docs/.
          - name: docs-check
            glob:
              - "docs/**"
              - "tools/scripts/src/checks/docs-check/*.ts"
              - "tools/scripts/src/checks/json.ts"
              - "pnpm-workspace.yaml"
            run: node tools/scripts/src/checks/docs-check/cli.ts staged
          - name: shellcheck
            glob:
              - "*.sh"
              - "mise.toml"
              - "mise.lock"
            run: tools/scripts/sh/shellcheck.sh
          # jactionlint also runs shellcheck on run: scripts, so a shellcheck upgrade (mise.toml) re-checks workflows too.
          - name: lint-workflows
            glob:
              - ".github/workflows/*.{yml,yaml}"
              - ".github/jactionlint.yaml"
              - "tools/scripts/sh/lint-workflows.sh"
              - "mise.toml"
              - "mise.lock"
            run: tools/scripts/sh/lint-workflows.sh
          # The breaking-change check (openapi-breaking.sh) compares with origin/main, so only CI runs it.
          - name: openapi-lint
            glob:
              - "apps/api/openapi.json"
              - ".spectral.yaml"
              - "tools/scripts/sh/openapi-lint.sh"
              - "mise.toml"
              - "mise.lock"
            run: tools/scripts/sh/openapi-lint.sh
          # Knip reads every workspace project and the root. Besides code, it reads what names dependencies and entries:
          # package.json scripts, workflows, lefthook.yml, the configs of the tools it has plugins for (nx.json, mise.toml,
          # .markdownlint-cli2.yaml ...), and the files behind the exceptions in knip.jsonc.
          - name: unused-code
            glob:
              - "*.{js,cjs,mjs,jsx,ts,cts,mts,tsx}"
              - "**/package.json"
              - "**/tsconfig.json"
              - "knip.jsonc"
              - "pnpm-workspace.yaml"
              - "lefthook.yml"
              - ".github/workflows/*.{yml,yaml}"
              - "nx.json"
              - "mise.toml"
              - ".markdownlint-cli2.yaml"
              - ".kiro/settings/mcp.json"
            run: pnpm lint:unused
          - name: skills-lock
            glob:
              - ".agents/**"
              - ".kiro/skills/**"
              - "skills-lock.json"
              - "tools/scripts/src/checks/skills-lock/*.ts"
              - "tools/scripts/src/checks/json.ts"
            run: node tools/scripts/src/checks/skills-lock/cli.ts
          # Runs the Renovate pinned in tools/scripts/sh/renovate.sh through `pnpm dlx`, so it needs the network.
          - name: renovate-config
            glob:
              - "renovate.jsonc"
              - "tools/scripts/sh/renovate.sh"
            run: tools/scripts/sh/renovate.sh validate

    - name: nx-tasks
      group:
        parallel: true
        jobs:
          # The checks and hooks written in TypeScript (tools/scripts). Nx skips the run when the cached result
          # still holds. Besides the project, the tests depend on the files in `sharedGlobals` of nx.json:
          # pnpm-workspace.yaml pins Vitest and the other tools, the root vite.config.ts holds the
          # no-restricted-imports override the fixture checks, and tsconfig.json and .node-version set the
          # compiler and the runtime. Keep this list in step with `sharedGlobals`, and with the inputs of the
          # `test` target in tools/scripts/package.json (.kiro/hooks/*.json, which kiro-hooks.test.ts reads).
          # The isolation project is not part of `test`: it runs the whole unit project a second time in a decoy
          # repository, and it cannot stop a test that touches this repository, because the unit project runs here
          # in the same hook. pre-push and CI run it when the isolation setup changes (docs/adr/0024, "隔離").
          - name: scripts-test
            glob:
              - "tools/scripts/**"
              - "pnpm-workspace.yaml"
              - "vite.config.ts"
              - "tsconfig.json"
              - ".node-version"
              - ".kiro/hooks/*.json"
            run: pnpm exec nx test scripts
          # The Kysely types of the module schemas match the migrations (packages/db/src/types.ts, docs/adr/0025). It starts a
          # PostgreSQL container (about 10 s), so it runs only when a migration, a generated type file, the generator or the
          # version of kysely-codegen (pnpm-workspace.yaml) changes. Nx skips the run when the cached result still holds.
          - name: db-types
            glob:
              - "packages/db/migrations/**"
              - "packages/db/bootstrap.sql"
              - "packages/db/src/types.ts"
              - "packages/*/src/infrastructure/db.gen.ts"
              - "packages/db/src/testing/connection.ts"
              - "packages/db/src/testing/prepare-database.ts"
              - "pnpm-workspace.yaml"
            run: pnpm exec nx db-types-check db
          # effect-tsgo on application and infrastructure of the modules (oxlint.effect.json, docs/tooling/effect-lint.md).
          # The lint target (vp check) does not load its plugin. Nx skips the run when the cached result still holds.
          - name: lint-effect
            glob:
              - "packages/**"
              - "oxlint.effect.json"
              - "pnpm-workspace.yaml"
              - "pnpm-lock.yaml"
              - "vite.config.ts"
              - "tsconfig.json"
            run: pnpm exec nx run-many -t lint-effect

pre-push:
  # The jobs run in parallel: the slow ones (nx-affected-test, nx-affected-test-tools) are independent, and run in
  # sequence they took the sum of their times (about 390 s). Measured 2026-10-30 with --skip-nx-cache under a load
  # average of about 30: the four slow commands together took 294 s, and api:test did not fail. It had failed
  # when the IdP was Keycloak, which waited 180 s to start (docs/tooling/worktrees.md); node-oidc-provider (#441)
  # replaced it. Each job that reads the pushed refs has use_stdin: lefthook gives every job the whole of stdin.
  parallel: true
  commands:
    guard-push:
      run: tools/scripts/sh/guard-push.sh
      use_stdin: true
    secret-scan:
      # Scan only the commits being pushed. Git passes "<local ref> <local sha> <remote ref> <remote sha>" on stdin.
      run: node tools/scripts/src/checks/secret-scan/cli.ts pre-push
      use_stdin: true
    # Warns only (docs/adr/0016). Silence it with ADR_ACK=1 for a change that needs no ADR.
    adr-check:
      run: node tools/scripts/src/checks/adr-check/cli.ts pre-push
      use_stdin: true
    # Warns only, like adr-check. Silence it with TESTS_ACK=1 when deleting tests or reducing test cases is intended.
    test-weakening:
      run: node tools/scripts/src/checks/test-weakening/cli.ts pre-push
      use_stdin: true
    # Two open PRs can take the same ADR number (docs/tooling/worktrees.md ("PR を出す")).
    # Exit 1 (number taken) stops the push. Exit 2 (gh could not list the PRs) only prints its message, so being offline does not block a push.
    adr-number:
      run: node tools/scripts/src/checks/check-adr-number/cli.ts || [ $? -ne 1 ]
    # The three nx-affected jobs run through tee-log.sh, which keeps their output in hook-logs/<job>.log in the git
    # directory of the worktree (docs/tooling/worktrees.md ("PR を出す")). A failure after minutes is then read, not run again.
    # The `test` target of every project that the branch affects, as CI runs it (coverage thresholds included).
    # pre-commit runs only the tests of tools/scripts, so a coverage failure in apps/api first showed up in CI
    # (#178). Nx skips the projects whose cached result still holds. NX_BASE is what CI sets for the same command.
    nx-affected-test:
      run: tools/scripts/sh/tee-log.sh nx-affected-test pnpm exec nx affected -t test --base=origin/main --head=HEAD
    # The keys of the texts match the code, as CI runs it (packages/i18n, docs/adr/0044). Nx skips the projects whose
    # cached result still holds.
    nx-affected-i18n-keys:
      run: tools/scripts/sh/tee-log.sh nx-affected-i18n-keys pnpm exec nx affected -t i18n-keys --base=origin/main --head=HEAD
    # The tests that run a real tool from mise.lock on a real config (*.tools.test.ts), for the projects the branch
    # affects, as CI runs them. They take minutes, so they run here and not in pre-commit. Nx decides from the
    # inputs of the test-tools target (tools/scripts/package.json) and skips the projects whose cached result still
    # holds. Needs the tools of mise.lock (`mise install --locked`).
    nx-affected-test-tools:
      run: tools/scripts/sh/tee-log.sh nx-affected-test-tools pnpm exec nx affected -t test-tools --base=origin/main --head=HEAD
    # The isolation test (docs/adr/0024, "隔離") takes about 50 s, so it runs only when what it checks changes. CI asks
    # the same tools/scripts/src/checks/isolation-scope, so the two cannot drift apart. If it fails, the push stops.
    nx-test-isolation:
      run: scope="$(node tools/scripts/src/checks/isolation-scope/cli.ts origin/main HEAD)" || exit 1; [ "$scope" != run ] || pnpm exec nx test-isolation scripts
    # The same SAST as CI, so an agent sees a new finding before the pull request (docs/adr/0021).
    # Fails only on ERROR findings that the branch adds to origin/main. Needs the network for the Registry rules.
    # Exit 1 (a new finding) stops the push. Exit 2 or more (could not scan: offline, no fetch) only prints its message.
    semgrep:
      run: node tools/scripts/src/checks/semgrep/cli.ts || [ $? -ne 1 ]
    # Warns only. dependency review in CI is the gate for dependencies (docs/adr/0021).
    osv-scanner:
      run: tools/scripts/sh/osv-scanner.sh

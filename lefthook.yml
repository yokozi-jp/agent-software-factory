# Git hooks. Installed by `pnpm install` (root `prepare` script runs `lefthook install`).
# Docs: https://lefthook.dev/configuration/
# Why lefthook instead of Vite+ hooks: docs/adr/0001-lefthook-for-git-hooks.md

# scripts/secret-scan.sh, scripts/shellcheck.sh and scripts/lint-workflows.sh run their linters through `mise exec`,
# so the tools pinned in mise.toml must be installed (`mise install --locked`, docs/local-env-setup/setup.md).

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: secret-scan
      run: scripts/secret-scan.sh staged
    # Lint Markdown only after the formatter has rewritten the staged files.
    - name: format-and-lint
      group:
        piped: true
        jobs:
          - name: check
            glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,md,css,html,yml,yaml}"
            exclude:
              - ".agents/**"
              - ".kiro/skills/**"
              - "**/routeTree.gen.ts"
            run: pnpm exec vp check --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: markdownlint
            glob: "*.md"
            run: pnpm exec markdownlint-cli2 {staged_files}
    - name: docs-check
      glob:
        - "docs/**"
        - "scripts/docs-check.sh"
        - "scripts/docs-links.mjs"
      run: scripts/docs-check.sh staged
    - name: shellcheck
      glob:
        - "*.sh"
        - "mise.toml"
        - "mise.lock"
      run: scripts/shellcheck.sh
    # jactionlint also runs shellcheck on run: scripts, so a shellcheck upgrade (mise.toml) re-checks workflows too.
    - name: lint-workflows
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/jactionlint.yaml"
        - "scripts/lint-workflows.sh"
        - "mise.toml"
        - "mise.lock"
      run: scripts/lint-workflows.sh
    # jscpd scans the working tree as a whole (.jscpd.json), since a clone spans files you did not stage.
    # pnpm-workspace.yaml pins the jscpd version, so an upgrade re-runs the check.
    - name: duplicate-code
      glob:
        - "apps/**"
        - "packages/**"
        - ".jscpd.json"
        - "pnpm-workspace.yaml"
      run: pnpm lint:dup
    # Knip reads every workspace project and the root. Besides code, it reads what names dependencies and entries:
    # package.json scripts, workflows, lefthook.yml, the configs of the tools it has plugins for (nx.json, mise.toml,
    # .markdownlint-cli2.yaml ...), and the files behind the exceptions in knip.jsonc.
    - name: unused-code
      glob:
        - "*.{js,cjs,mjs,jsx,ts,cts,mts,tsx}"
        - "**/package.json"
        - "**/tsconfig.json"
        - "knip.jsonc"
        - "pnpm-workspace.yaml"
        - "lefthook.yml"
        - ".github/workflows/*.{yml,yaml}"
        - "nx.json"
        - "mise.toml"
        - ".markdownlint-cli2.yaml"
        - "scripts/docs-check.sh"
        - ".kiro/settings/mcp.json"
      run: pnpm lint:unused
    - name: skills-lock
      glob:
        - ".agents/**"
        - ".kiro/skills/**"
        - "skills-lock.json"
        - "scripts/verify-skills-lock.mjs"
      run: node scripts/verify-skills-lock.mjs
    # Behaviour tests (scripts/test/) for the scripts and Kiro hooks that changed.
    - name: kiro-hooks-test
      glob:
        - ".kiro/hooks/*.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/kiro-hooks.test.sh"
      run: sh scripts/test/run.sh scripts/test/kiro-hooks.test.sh
    - name: repo-checks-test
      glob:
        - "scripts/check-repo-policy.sh"
        - "scripts/docs-check.sh"
        - "scripts/docs-links.mjs"
        - "scripts/test/lib.sh"
        - "scripts/test/repo-checks.test.sh"
      run: sh scripts/test/run.sh scripts/test/repo-checks.test.sh
    - name: secret-scan-test
      glob:
        - "scripts/secret-scan.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/secret-scan.test.sh"
      run: sh scripts/test/run.sh scripts/test/secret-scan.test.sh
    # Tests run from this hook with GIT_DIR set; isolation.test.sh proves they still stay in their sandbox.
    # Only lib.sh decides isolation, so this runs when it changes. CI runs it for every change.
    - name: isolation-test
      glob:
        - "scripts/test/lib.sh"
        - "scripts/test/isolation.test.sh"
      run: sh scripts/test/run.sh scripts/test/isolation.test.sh
    - name: guard-push-test
      glob:
        - "scripts/guard-push.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/guard-push.test.sh"
      run: sh scripts/test/run.sh scripts/test/guard-push.test.sh
    - name: lint-workflows-test
      glob:
        - "scripts/lint-workflows.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/lint-workflows.test.sh"
        # The test copies them, and a new linter version or profile can change what it reports.
        - ".github/jactionlint.yaml"
        - "mise.toml"
        - "mise.lock"
      run: sh scripts/test/run.sh scripts/test/lint-workflows.test.sh
    - name: duplicate-code-test
      glob:
        - ".jscpd.json"
        - ".gitignore"
        - "scripts/test/lib.sh"
        - "scripts/test/duplicate-code.test.sh"
        # A new jscpd version (pinned in the catalog) can change what it reports.
        - "pnpm-workspace.yaml"
      run: sh scripts/test/run.sh scripts/test/duplicate-code.test.sh
    - name: adr-number-test
      glob:
        - "scripts/check-adr-number.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/adr-number.test.sh"
      run: sh scripts/test/run.sh scripts/test/adr-number.test.sh
    # Both run Renovate through `pnpm dlx` (the version is pinned in scripts/renovate.sh) and need the network.
    - name: renovate-config
      glob:
        - "renovate.jsonc"
        - "scripts/renovate.sh"
      run: scripts/renovate.sh validate
    - name: renovate-test
      glob:
        - "scripts/renovate.sh"
        - "scripts/renovate-preview.mjs"
        - "scripts/test/lib.sh"
        - "scripts/test/renovate.test.sh"
      run: sh scripts/test/run.sh scripts/test/renovate.test.sh
    - name: unused-code-test
      glob:
        - "knip.jsonc"
        - "scripts/test/lib.sh"
        - "scripts/test/unused-code.test.sh"
        # A new Knip version (pinned in the catalog) can change what it reports.
        - "pnpm-workspace.yaml"
      run: sh scripts/test/run.sh scripts/test/unused-code.test.sh
    - name: worktree-test
      glob:
        - "scripts/worktree.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/worktree.test.sh"
      run: sh scripts/test/run.sh scripts/test/worktree.test.sh
    - name: adr-check-test
      glob:
        - "scripts/adr-check.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/adr-check.test.sh"
      run: sh scripts/test/run.sh scripts/test/adr-check.test.sh
    - name: semgrep-test
      glob:
        - "scripts/semgrep.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/semgrep.test.sh"
        # A new Semgrep version (or its dependency graph in .mise/locks/) can change what it reports.
        - "mise.toml"
        - "mise.lock"
        - ".mise/locks/**"
      run: sh scripts/test/run.sh scripts/test/semgrep.test.sh
    - name: osv-scanner-test
      glob:
        - "scripts/osv-scanner.sh"
        - "scripts/test/lib.sh"
        - "scripts/test/osv-scanner.test.sh"
        - "mise.toml"
        - "mise.lock"
      run: sh scripts/test/run.sh scripts/test/osv-scanner.test.sh
    - name: repo-policy
      glob:
        - "**/package.json"
        - "**/vite.config.ts"
        - ".vite-hooks/**"
        - ".betterleaks.toml"
        - "mise.toml"
        - ".kiro/steering/**"
        - "scripts/check-repo-policy.sh"
        # Plain-text references to docs/ live in these files. "*.md" matches Markdown at any depth (AGENTS.md, README.md ...).
        - "*.md"
        - "lefthook.yml"
        - ".github/**"
        - ".kiro/hooks/**"
        - "scripts/**"
        - "docs/**"
        - "**/*.ts"
      # Check what is staged, so unstaged edits to other files cannot fail the commit.
      run: scripts/check-repo-policy.sh staged

pre-push:
  commands:
    guard-push:
      run: scripts/guard-push.sh
      use_stdin: true
    secret-scan:
      # Scan only the commits being pushed. Git passes "<local ref> <local sha> <remote ref> <remote sha>" on stdin.
      run: scripts/secret-scan.sh pre-push
      use_stdin: true
    # Warns only (docs/adr/0016). Silence it with ADR_ACK=1 for a change that needs no ADR.
    adr-check:
      run: scripts/adr-check.sh pre-push
      use_stdin: true
    # Two open PRs can take the same ADR number (docs/tooling/worktrees.md ("PR を出す")).
    # Exit 1 (number taken) stops the push. Exit 2 (gh could not list the PRs) only prints its message, so being offline does not block a push.
    adr-number:
      run: scripts/check-adr-number.sh || [ $? -ne 1 ]
    # The same SAST as CI, so an agent sees a new finding before the pull request (docs/adr/0021).
    # Fails only on ERROR findings that the branch adds to origin/main. Needs the network for the Registry rules.
    # Exit 1 (a new finding) stops the push. Exit 2 or more (could not scan: offline, no fetch) only prints its message.
    semgrep:
      run: scripts/semgrep.sh || [ $? -ne 1 ]
    # Warns only. dependency review in CI is the gate for dependencies (docs/adr/0021).
    osv-scanner:
      run: scripts/osv-scanner.sh

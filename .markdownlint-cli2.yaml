# markdownlint-cli2: https://github.com/DavidAnson/markdownlint-cli2
# Run: pnpm lint:md   Fix: pnpm exec markdownlint-cli2 --fix "**/*.md"
# Layout (tables, list markers, spacing) is owned by oxfmt (`vp fmt`); this config checks structure and content.

config:
  # Japanese prose, tables and URLs make line-length limits noisy.
  MD013: false

  # Allow the same heading under different parents (e.g. "Consequences" in several sections).
  MD024:
    siblings_only: true

  # OKF documents carry `title` in frontmatter and also start with an H1. Do not count the frontmatter title as an H1.
  MD025:
    front_matter_title: ""

  # Table formatting is left to oxfmt so the formatter and the linter never disagree.
  MD060: false

ignores:
  - "**/node_modules/**"
  # Agent skills installed from upstream (tracked by skills-lock.json). Must stay byte-identical.
  - ".agents/skills/**"
  # Symlinks to .agents/skills. markdownlint-cli2 follows them.
  - ".kiro/skills/**"
  # Generated by nx release.
  - "**/CHANGELOG.md"

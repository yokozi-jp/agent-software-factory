# IWE configuration for docs/ (OKF v0.2 bundle). Generated by `iwe init --okf` (iwe 0.29.0), then trimmed:
# AI actions and `[commands.default]` (`claude -p`) were removed, and so were the rewriting actions
# (extract, inline, ...). See docs/adr/0005 and 0006.
format = "markdown"
version = 4

[workspace]
date_format = "%Y-%m-%d"
path = ""

[markdown]
date_format = "%b %d, %Y"
# overridden: set on the command line
refs_extension = ".md"
refs_path = "relative"
# detected: 0 link texts match their target title, 3 diverge
refs_text = "preserve"
wiki_link_path = "preserve"

[markdown.formatting]
# detected: 1 of 1 emphasis spans use _
emphasis_token = "_"
# detected: 8 of 8 ordered list items indent content to column 3
ordered_list_content_indent = 3
# detected: 2 of 8 files contain runs of blank lines
preserve_newlines = true

[djot]
date_format = "%b %d, %Y"
refs_extension = ".md"
refs_path = "relative"
refs_text = "preserve"

[djot.formatting]
emphasis_token = "_"
ordered_list_content_indent = 3
preserve_newlines = true

[completion]
# detected: 0 wiki links vs 4 markdown links
link_format = "markdown"

[search]
# detected: 92 stopword hits for english, 13 for the next language
language = "english"

[templates.default]
document_template = """
# {{title}}

{{content}}"""
# detected: 8 of 8 filenames use slug style
key_template = "{{slug}}"

[schemas]

[schemas.okf]
match = ["**", "!index", "!**/index", "!log", "!**/log"]

[schemas.okf-index]
match = ["index", "**/index"]

[schemas.okf-log]
match = ["log", "**/log"]
